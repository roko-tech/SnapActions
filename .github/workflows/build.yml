name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: this workflow only builds and tests, so a read-only token is all it needs.
permissions:
  contents: read

jobs:
  build:
    # WPF + WinForms only resolve on Windows runners.
    runs-on: windows-latest
    steps:
      # Third-party actions pinned to a commit SHA (not a mutable tag) so a compromised tag can't
      # silently change what runs in CI. Version in the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.303'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Build, test, publish and verify package
        run: python tools/package.py --output artifacts/ci

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-package-and-checks
          path: artifacts/ci
