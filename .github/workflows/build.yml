name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: this workflow only builds and tests, so a read-only token is all it needs.
permissions:
  contents: read

jobs:
  build:
    # WPF + WinForms only resolve on Windows runners.
    runs-on: windows-latest
    steps:
      # Third-party actions pinned to a commit SHA (not a mutable tag) so a compromised tag can't
      # silently change what runs in CI. Version in the trailing comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '10.0.303'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Build, test, publish and verify package
        run: python tools/package.py --output artifacts/ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-package-and-checks
          path: artifacts/ci
